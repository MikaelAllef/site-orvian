# Configuração de deploy no Netlify.
# Front: Vite gera `dist/`. API: funções em `netlify/functions/` (/api/chat e /api/quote).
# Variáveis (Site configuration → Environment variables):
#   GEMINI_API_KEY, GEMINI_MODEL (opcional), QUOTE_WEBHOOK_URL, QUOTE_WEBHOOK_SECRET

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cabeçalhos de segurança (equivalentes aos do server.ts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Arquivos com hash no nome podem ficar em cache por 1 ano
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
